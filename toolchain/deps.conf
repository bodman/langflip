# Declarative host & bootstrap dependencies for LangFlip
# Format for HOST_DEPS entries:
#   <binary_to_check>|<apt_package>|<dnf_package>|<pacman_package>|<purpose>
#
# Both already-installed and not-yet-installed host prerequisites are declared
# here so any fresh clone knows every dependency required to build and test.

HOST_DEPS=(
  "curl|curl|curl|curl|Download pinned rustup-init archive"
  "sha256sum|coreutils|coreutils|coreutils|Verify rustup-init SHA-256 checksum"
  "gcc|build-essential|gcc|base-devel|Link native Linux host tests (langflip-core)"
  "x86_64-w64-mingw32-gcc|mingw-w64|mingw64-gcc|mingw-w64-gcc|Cross-link Windows 11 binary (x86_64-pc-windows-gnu)"
  "update-ca-certificates|ca-certificates|ca-certificates|ca-certificates|TLS root certificates for HTTPS downloads"
)

# Pinned rustup-init release (official static archive)
RUSTUP_VERSION="1.29.2"
RUSTUP_HOST_TRIPLE="x86_64-unknown-linux-gnu"
RUSTUP_INIT_URL="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUSTUP_HOST_TRIPLE}/rustup-init"
RUSTUP_INIT_SHA256_URL="${RUSTUP_INIT_URL}.sha256"

# Optional hard-pinned SHA-256 for rustup-init.
# If empty on first bootstrap, setup-env.sh verifies against the official .sha256
# file from static.rust-lang.org and prints the exact hash to pin here.
RUSTUP_INIT_SHA256=""
