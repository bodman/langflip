<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Animated terminal demo showing LangFlip converting mistyped Hebrew 'עןא דאשאוד' to 'git status' on Pause/Break">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <!-- Reveal mistyped command "עןא דאשאוד" right after PS C:\dev> -->
    <clipPath id="mistypeClip">
      <rect x="155" y="102" height="36" width="0">
        <animate attributeName="width"
          values="0;145;145;0;0"
          keyTimes="0;0.30;0.48;0.51;1"
          dur="8.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <!-- Instantly show converted "git status" right after Pause/Break -->
    <clipPath id="convertedClip">
      <rect x="155" y="102" height="36" width="0">
        <animate attributeName="width"
          values="0;0;125;125;0"
          keyTimes="0;0.52;0.55;0.94;1"
          dur="8.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <!-- Separately reveal " -s" typed AFTER the flip to show seamless continued typing -->
    <clipPath id="continueClip">
      <rect x="268" y="102" height="36" width="0">
        <animate attributeName="width"
          values="0;0;0;60;60;0"
          keyTimes="0;0.64;0.66;0.74;0.94;1"
          dur="8.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Code", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .phase-he { animation: showHe 8.5s infinite; }
    .phase-en { animation: showEn 8.5s infinite; }
    .hotkey-pop {
      animation: popKey 8.5s infinite;
      transform-origin: 619px 217px;
    }

    @keyframes showHe {
      0%, 49% { opacity: 1; }
      52%, 97% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes showEn {
      0%, 51% { opacity: 0; }
      55%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes popKey {
      0%, 36% { opacity: 0.25; transform: scale(0.95); }
      41%, 52% { opacity: 1; transform: scale(1.05); }
      57%, 100% { opacity: 0.25; transform: scale(0.95); }
    }
  </style>

  <!-- Outer background -->
  <rect width="760" height="280" rx="14" fill="url(#bgGrad)"/>

  <!-- Terminal window -->
  <g filter="url(#shadow)">
    <rect x="24" y="22" width="712" height="236" rx="10" fill="#0B1120" stroke="#334155" stroke-width="1.2"/>
    <!-- Title bar -->
    <path d="M24 32 a10 10 0 0 1 10 -10 h692 a10 10 0 0 1 10 10 v24 h-712 z" fill="#1E293B"/>
    <!-- Window dots -->
    <circle cx="46" cy="39" r="5" fill="#EF4444" opacity="0.85"/>
    <circle cx="64" cy="39" r="5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="82" cy="39" r="5" fill="#10B981" opacity="0.85"/>
    <text x="104" y="43" class="sans" font-size="12" font-weight="600" fill="#CBD5E1">Windows Terminal — PowerShell</text>

    <!-- LangFlip brand pill (top-right) -->
    <rect x="598" y="28" width="124" height="22" rx="11" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="605" y="32" width="14" height="14" rx="3" fill="url(#accentGrad)"/>
    <path d="M608 37 h6 m-2 -2 l2 2 l-2 2 M616 41 h-6 m2 -2 l-2 2 l2 2" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="625" y="43" class="sans" font-size="11" font-weight="600" fill="#E2E8F0">Layout:</text>

    <!-- Active layout indicator HEB -> ENG -->
    <g class="phase-he">
      <rect x="670" y="31" width="44" height="16" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
      <text x="692" y="43" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FDE68A">HEB</text>
    </g>
    <g class="phase-en">
      <rect x="670" y="31" width="44" height="16" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <text x="692" y="43" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#A7F3D0">ENG</text>
    </g>
  </g>

  <!-- Terminal content -->
  <text x="44" y="84" class="mono" font-size="12.5" fill="#64748B"># Started typing "git status" while accidentally in Hebrew layout:</text>

  <!-- Prompt -->
  <text x="44" y="126" class="mono" font-size="17" font-weight="700" fill="#38BDF8">PS C:\dev&gt;</text>

  <!-- Phase 1: Entire command mistyped in Hebrew ("עןא דאשאוד" = physical keys for "git status") -->
  <g clip-path="url(#mistypeClip)">
    <text x="158" y="126" class="mono" font-size="18" font-weight="600" fill="#FBBF24">עןא דאשאוד</text>
  </g>

  <!-- Phase 2: Entire command converted in-place to "git status" -->
  <g clip-path="url(#convertedClip)">
    <text x="158" y="126" class="mono" font-size="18" font-weight="600" fill="#34D399">git status</text>
  </g>

  <!-- Phase 3: Continued typing " -s" in English after the flip -->
  <g clip-path="url(#continueClip)">
    <text x="272" y="126" class="mono" font-size="18" font-weight="600" fill="#E2E8F0">-s</text>
  </g>

  <!-- Status explanation line -->
  <g class="phase-he">
    <text x="44" y="166" class="sans" font-size="13" fill="#F59E0B">● Typed "עןא דאשאוד" by mistake — press Pause/Break to flip in-place</text>
  </g>
  <g class="phase-en">
    <text x="44" y="166" class="sans" font-size="13" fill="#10B981">✓ Flipped to "git status" + switched layout to ENG — keep typing "-s" seamlessly</text>
  </g>

  <!-- Footer bar inside terminal -->
  <line x1="44" y1="186" x2="716" y2="186" stroke="#1E293B" stroke-width="1"/>
  <text x="44" y="212" class="sans" font-size="12" fill="#94A3B8">Switch &amp; confirm layout first → erase → replay physical scan codes (no clipboard)</text>
  <text x="44" y="232" class="sans" font-size="11.5" fill="#64748B">Works in Notepad, Edge/Chrome (incl. Omnibox), PowerShell, CMD &amp; Windows Terminal</text>

  <!-- Animated Hotkey Badge -->
  <g class="hotkey-pop">
    <rect x="526" y="196" width="186" height="42" rx="8" fill="url(#accentGrad)" stroke="#93C5FD" stroke-width="1.4"/>
    <text x="619" y="214" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" fill="#DBEAFE">HOTKEY PRESSED</text>
    <text x="619" y="230" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#FFFFFF">Pause / Break  ⇄</text>
  </g>
</svg>
