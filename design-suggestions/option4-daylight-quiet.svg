<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410">
  <defs>
    <filter id="sh4" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1C1917" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    .s { font-family: "Segoe UI", -apple-system, sans-serif; }
    .m { font-family: Consolas, ui-monospace, monospace; }
  </style>
  <rect width="700" height="410" rx="12" fill="#EAEAE5"/>

  <!-- Settings Window: Warm Paper Quiet Light -->
  <g filter="url(#sh4)">
    <rect x="24" y="22" width="440" height="366" rx="10" fill="#F7F7F5" stroke="#DDDCD6" stroke-width="1"/>
    <text x="44" y="47" class="s" font-size="12" fill="#78716C">LangFlip</text>
    <text x="442" y="47" class="s" font-size="13" fill="#A8A29E">✕</text>
    <line x1="25" y1="58" x2="463" y2="58" stroke="#E7E5E0" stroke-width="1"/>

    <text x="44" y="88" class="s" font-size="18" font-weight="600" fill="#1C1917">Settings</text>
    <text x="44" y="106" class="s" font-size="12" fill="#78716C">Languages and trigger shortcut</text>

    <!-- Card 1 -->
    <rect x="44" y="122" width="400" height="104" rx="8" fill="#FFFFFF" stroke="#E5E4DF" stroke-width="1"/>
    <text x="60" y="143" class="s" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#78716C">LANGUAGES</text>

    <text x="60" y="172" class="s" font-size="13" fill="#44403C">Primary</text>
    <rect x="154" y="152" width="274" height="30" rx="5" fill="#FAFAF8" stroke="#D6D3CE" stroke-width="1"/>
    <text x="166" y="172" class="s" font-size="13" fill="#1C1917">English (India)</text>
    <text x="408" y="172" class="s" font-size="11" fill="#78716C">▾</text>

    <text x="60" y="208" class="s" font-size="13" fill="#44403C">Secondary</text>
    <rect x="154" y="188" width="274" height="30" rx="5" fill="#FAFAF8" stroke="#D6D3CE" stroke-width="1"/>
    <text x="166" y="208" class="s" font-size="13" fill="#1C1917">Hebrew</text>
    <text x="408" y="208" class="s" font-size="11" fill="#78716C">▾</text>

    <!-- Card 2 -->
    <rect x="44" y="238" width="400" height="92" rx="8" fill="#FFFFFF" stroke="#E5E4DF" stroke-width="1"/>
    <text x="60" y="259" class="s" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#78716C">SHORTCUT</text>

    <text x="60" y="286" class="s" font-size="13" fill="#44403C">Key</text>
    <rect x="154" y="266" width="136" height="28" rx="5" fill="#FAFAF8" stroke="#D6D3CE" stroke-width="1"/>
    <text x="166" y="285" class="s" font-size="13" fill="#1C1917">Pause</text>
    <text x="272" y="285" class="s" font-size="11" fill="#78716C">▾</text>

    <text x="60" y="317" class="s" font-size="13" fill="#44403C">Modifiers</text>
    <rect x="154" y="300" width="52" height="23" rx="5" fill="#F5F5F3" stroke="#D6D3CE" stroke-width="1"/>
    <text x="180" y="316" text-anchor="middle" class="s" font-size="11.5" fill="#57534E">Ctrl</text>
    <rect x="214" y="300" width="48" height="23" rx="5" fill="#F5F5F3" stroke="#D6D3CE" stroke-width="1"/>
    <text x="238" y="316" text-anchor="middle" class="s" font-size="11.5" fill="#57534E">Alt</text>
    <rect x="270" y="300" width="56" height="23" rx="5" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>
    <text x="298" y="316" text-anchor="middle" class="s" font-size="11.5" font-weight="600" fill="#1E293B">Shift</text>
    <rect x="334" y="300" width="52" height="23" rx="5" fill="#F5F5F3" stroke="#D6D3CE" stroke-width="1"/>
    <text x="360" y="316" text-anchor="middle" class="s" font-size="11.5" fill="#57534E">Win</text>

    <!-- Footer Buttons -->
    <rect x="272" y="344" width="82" height="30" rx="6" fill="#334155"/>
    <text x="313" y="363" text-anchor="middle" class="s" font-size="13" font-weight="600" fill="#FFFFFF">Save</text>
    <rect x="362" y="344" width="82" height="30" rx="6" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1"/>
    <text x="403" y="363" text-anchor="middle" class="s" font-size="13" fill="#44403C">Cancel</text>
  </g>

  <!-- Tray Popup Menu Preview -->
  <text x="502" y="136" class="s" font-size="11" font-weight="600" fill="#78716C">TRAY MENU</text>
  <g filter="url(#sh4)">
    <rect x="500" y="148" width="174" height="108" rx="8" fill="#FFFFFF" stroke="#DDDCD6" stroke-width="1"/>
    <text x="516" y="172" class="s" font-size="11.5" font-weight="600" fill="#78716C">LangFlip</text>
    <line x1="510" y1="182" x2="664" y2="182" stroke="#ECEAE4" stroke-width="1"/>
    <rect x="506" y="188" width="162" height="28" rx="5" fill="#F2F1EC"/>
    <text x="518" y="206" class="s" font-size="13" fill="#1C1917">Settings...</text>
    <text x="518" y="238" class="s" font-size="13" fill="#44403C">Exit</text>
  </g>
</svg>
