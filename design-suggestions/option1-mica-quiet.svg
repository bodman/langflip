<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" width="700" height="410">
  <defs>
    <filter id="sh1" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>
    .s { font-family: "Segoe UI", -apple-system, sans-serif; }
    .m { font-family: Consolas, ui-monospace, monospace; }
  </style>
  <rect width="700" height="410" rx="12" fill="#141416"/>

  <!-- Settings Window -->
  <g filter="url(#sh1)">
    <rect x="24" y="22" width="440" height="366" rx="10" fill="#1F1F22" stroke="#34343A" stroke-width="1"/>
    <!-- Title bar -->
    <text x="44" y="47" class="s" font-size="12" fill="#A1A1AA">LangFlip</text>
    <text x="442" y="47" class="s" font-size="13" fill="#71717A">✕</text>
    <line x1="25" y1="58" x2="463" y2="58" stroke="#2C2C31" stroke-width="1"/>

    <!-- Header -->
    <text x="44" y="88" class="s" font-size="18" font-weight="600" fill="#F4F4F5">Settings</text>
    <text x="44" y="106" class="s" font-size="12" fill="#8E8E98">Languages and trigger shortcut</text>

    <!-- Card 1: Languages -->
    <rect x="44" y="122" width="400" height="104" rx="8" fill="#27272B" stroke="#35353B" stroke-width="1"/>
    <text x="60" y="143" class="s" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#8E8E98">LANGUAGES</text>

    <text x="60" y="172" class="s" font-size="13" fill="#D4D4D8">Primary</text>
    <rect x="154" y="152" width="274" height="30" rx="5" fill="#1E1E22" stroke="#3F3F46" stroke-width="1"/>
    <text x="166" y="172" class="s" font-size="13" fill="#F4F4F5">English (India)</text>
    <text x="408" y="172" class="s" font-size="11" fill="#A1A1AA">▾</text>

    <text x="60" y="208" class="s" font-size="13" fill="#D4D4D8">Secondary</text>
    <rect x="154" y="188" width="274" height="30" rx="5" fill="#1E1E22" stroke="#3F3F46" stroke-width="1"/>
    <text x="166" y="208" class="s" font-size="13" fill="#F4F4F5">Hebrew</text>
    <text x="408" y="208" class="s" font-size="11" fill="#A1A1AA">▾</text>

    <!-- Card 2: Shortcut -->
    <rect x="44" y="238" width="400" height="92" rx="8" fill="#27272B" stroke="#35353B" stroke-width="1"/>
    <text x="60" y="259" class="s" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#8E8E98">SHORTCUT</text>

    <text x="60" y="286" class="s" font-size="13" fill="#D4D4D8">Key</text>
    <rect x="154" y="266" width="136" height="28" rx="5" fill="#1E1E22" stroke="#3F3F46" stroke-width="1"/>
    <text x="166" y="285" class="s" font-size="13" fill="#F4F4F5">Pause</text>
    <text x="272" y="285" class="s" font-size="11" fill="#A1A1AA">▾</text>

    <text x="60" y="317" class="s" font-size="13" fill="#D4D4D8">Modifiers</text>
    <!-- Soft Toggle Pills (dark mode readable!) -->
    <rect x="154" y="300" width="52" height="23" rx="5" fill="#1E1E22" stroke="#3F3F46" stroke-width="1"/>
    <text x="180" y="316" text-anchor="middle" class="s" font-size="11.5" fill="#A1A1AA">Ctrl</text>
    <rect x="214" y="300" width="48" height="23" rx="5" fill="#1E1E22" stroke="#3F3F46" stroke-width="1"/>
    <text x="238" y="316" text-anchor="middle" class="s" font-size="11.5" fill="#A1A1AA">Alt</text>
    <rect x="270" y="300" width="56" height="23" rx="5" fill="#263850" stroke="#5B8AC4" stroke-width="1"/>
    <text x="298" y="316" text-anchor="middle" class="s" font-size="11.5" font-weight="600" fill="#DBEAFE">Shift</text>
    <rect x="334" y="300" width="52" height="23" rx="5" fill="#1E1E22" stroke="#3F3F46" stroke-width="1"/>
    <text x="360" y="316" text-anchor="middle" class="s" font-size="11.5" fill="#A1A1AA">Win</text>

    <!-- Footer Buttons -->
    <rect x="272" y="344" width="82" height="30" rx="6" fill="#3B6EB5"/>
    <text x="313" y="363" text-anchor="middle" class="s" font-size="13" font-weight="600" fill="#F8FAFC">Save</text>
    <rect x="362" y="344" width="82" height="30" rx="6" fill="#27272B" stroke="#3F3F46" stroke-width="1"/>
    <text x="403" y="363" text-anchor="middle" class="s" font-size="13" fill="#D4D4D8">Cancel</text>
  </g>

  <!-- Tray Popup Menu Preview -->
  <text x="502" y="136" class="s" font-size="11" font-weight="600" fill="#71717A">TRAY MENU</text>
  <g filter="url(#sh1)">
    <rect x="500" y="148" width="174" height="108" rx="8" fill="#242428" stroke="#38383F" stroke-width="1"/>
    <text x="516" y="172" class="s" font-size="11.5" font-weight="600" fill="#71717A">LangFlip</text>
    <line x1="510" y1="182" x2="664" y2="182" stroke="#34343B" stroke-width="1"/>
    <rect x="506" y="188" width="162" height="28" rx="5" fill="#323238"/>
    <text x="518" y="206" class="s" font-size="13" fill="#F4F4F5">Settings...</text>
    <text x="518" y="238" class="s" font-size="13" fill="#D4D4D8">Exit</text>
  </g>
</svg>
